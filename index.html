<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14284b">
  <title>座席案内 | 沖縄サントリーアリーナ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>座席案内</h1>
    <p class="venue">沖縄サントリーアリーナ</p>
  </header>

  <p class="trial-banner" role="note">
    試作版です。通路・階段・ゲートの階などは<strong>仮のデータ</strong>で、実際の道順と違うことがあります。
  </p>

  <main>
    <section class="card" aria-labelledby="here-title">
      <h2 id="here-title" class="visually-hidden">現在地</h2>
      <p id="here-text" class="here-text"></p>
      <details id="here-picker" class="here-picker">
        <summary>現在地を選び直す</summary>
        <label for="from-select">今いる場所</label>
        <select id="from-select"></select>
      </details>
    </section>

    <section class="card" aria-labelledby="seat-title">
      <h2 id="seat-title">座席番号を入れてください</h2>
      <form id="seat-form" novalidate>
        <div class="fields">
          <div class="field">
            <label for="block-select">ブロック</label>
            <select id="block-select" required></select>
          </div>
          <div class="field" id="row-field">
            <label for="row-select">列</label>
            <select id="row-select"></select>
          </div>
          <div class="field">
            <label for="seat-input">番</label>
            <input id="seat-input" type="number" inputmode="numeric" min="1" placeholder="例：12">
          </div>
        </div>
        <label class="check">
          <input id="avoid-stairs" type="checkbox">
          階段をなるべく避ける（エレベーターを使う）
        </label>
        <p id="form-error" class="form-error" role="alert"></p>
        <button type="submit" class="primary">ルートを表示</button>
      </form>
    </section>

    <section class="card map-card" aria-label="座席図">
      <div class="map-wrap">
        <svg id="map" role="img" aria-label="座席図とルート"></svg>
        <div class="map-tools">
          <button type="button" id="zoom-in" aria-label="拡大">＋</button>
          <button type="button" id="zoom-out" aria-label="縮小">－</button>
          <button type="button" id="zoom-fit" aria-label="ルート全体を表示">全体</button>
        </div>
      </div>
      <p class="map-hint">2本指で拡大・縮小、ドラッグで移動できます。</p>
    </section>

    <section class="card" id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title">座席までの道順</h2>
      <p id="result-summary" class="summary"></p>
      <ol id="steps" class="steps"></ol>
      <p id="result-note" class="note"></p>
      <p class="note">迷ったときは、近くの柱などに貼られたQRコードを読むと、現在地を更新できます（座席番号は覚えています）。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>入力した座席番号はこのスマホの中だけに保存されます。個人情報は集めていません。</p>
  </footer>

  <script src="data/venue-data.js"></script>
  <script src="js/route.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
